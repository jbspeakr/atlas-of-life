name: Verify and publish atlas
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Untrusted fork code must not execute on a persistent GPU runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # A GPU-equipped runner is intentional: hosted Linux software rasterizers
    # cannot certify the measured 60fps hardware contract or exact Mac baselines.
    runs-on: [self-hosted, macOS, ARM64, atlas-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            verification/report.json
            verification/artifacts/
      - name: Objective table in workflow summary
        if: always()
        run: node scripts/objective-summary.mjs
  comment:
    needs: verify
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verification
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('report.json','utf8'));
            const rows = Object.entries(report.summary.objective).map(([key,value]) => '| '+key+' | '+value+' |').join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'Atlas verification: '+report.summary.fail+' failures\n\n| Objective | Measured |\n|---|---:|\n'+rows});
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build immutable remote archive deployment
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_BASEMAP: remote
          VITE_BASEMAP_URL: ${{ vars.VITE_BASEMAP_URL }}
          VITE_TILE_ORIGINS: ${{ vars.VITE_TILE_ORIGINS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
  # Optional second deployment. Uncomment this whole job for Cloudflare Pages.
  # It rebuilds with a root base rather than reusing GitHub Pages' /repository/ build.
  # cloudflare:
